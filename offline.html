<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Offline — CoRadix Academy</title>
<style>
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;
       font-family:Inter,system-ui,sans-serif;background:#f5f7fa;color:#1c1c1e;text-align:center;padding:2rem}
  .box{max-width:360px}
  h1{font-size:1.4rem;margin:.5rem 0}
  p{color:#6b7280;line-height:1.6}
  button{margin-top:1rem;background:#0057ff;color:#fff;border:0;border-radius:6px;
         padding:.7rem 1.4rem;font-weight:600;font-size:.9rem;cursor:pointer}
</style>

<body>
  <div class="box">
    <div style="font-size:2.5rem">📡</div>
    <h1>You're offline</h1>
    <p>The CoRadix portal needs an internet connection to sign you in and load your materials. Check your connection and try again.</p>
    <button onclick="location.reload()">Try again</button>
  </div>
</body>
</html>
